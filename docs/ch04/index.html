'use strict';
// Chapter 4: how a message gets from talker to listener. The opening beats:
// open: the two terminals we ran in class, talker printing hello world ten times a second and listener printing
// I heard; how does a line get across? Slow it down: the terminals open like doors and the camera goes through the
// screen into the computer. pubsub: inside, talker's room and listener's room with a wall between; the nodes, their
// names, the topic's tube and its plate /chatter, talker's publisher and listener's subscription fitted on its ends,
// one message (a yellow slip stamped String) travelling in slow motion, opened to show its one field data, then the
// point: neither can see the other, both only know the topic's name and type.
const CHAPTER = { number: 4, title: '訊息怎麼從 talker 到 listener', minutes: 6, language: 'zh-TW', next: '../ch05/' };

/* ---------- the real terminal output and the course's code (captured.js, generated from the real captures) ---------- */
const shortTs = line => line.replace(/\[\d+\.\d+\]/, '[…]');   // the page shortens the timestamp to […]
// the 30 s run: talker printed hello world 0..295, listener heard 1..295 (its first was 1)
const termLine = (who, n) => shortTs(CAPTURED[who][Math.min(CAPTURED[who].length - 1, who === 'talker' ? n + 1 : n)]);
// a line of talker.py or listener.py as in the file, its trailing comment left out. Only the code is searched: each
// file opens with a docstring that compares ROS 1 and ROS 2 and quotes the same calls
const codeBody = file => { const L = CODE[file], a = L.findIndex(l => l.trim().startsWith('"""')), b = L.findIndex((l, i) => i > a && l.includes('"""')); return L.slice(b + 1); };
const codeLine = (file, needle) => {
  const line = codeBody(file).find(l => l.includes(needle));
  if (!line) throw new Error(`codeLine: no line with "${needle}" in ${file}.py`);
  return line.replace(/\s+#.*$/, '');
};
// Lines talker has printed by beat time t: ten a second from START (the timer's 0.1 s), easing to SLOW_RATE over RAMP
// once [[slow]] (ts) is said. A pure function of t; listener prints the same numbers from 1 (its first was 1).
const RATE = 10, START = .4, SLOW_RATE = .7, RAMP = 1.2;
const printedBy = (t, ts) => {
  if (t < START) return 0;
  let n = RATE * (Math.min(t, ts) - START);
  if (t > ts) {
    const u = Math.min(t - ts, RAMP);
    n += RATE * u - (RATE - SLOW_RATE) * u * u / (2 * RAMP);
    if (t > ts + RAMP) n += SLOW_RATE * (t - ts - RAMP);
  }
  return Math.floor(n) + 1;
};
// The message followed inside is the next one talker sends after the open beat's last line: its number read from that
// real line of the capture.
const NEXT_N = +CAPTURED.talker[printedBy(TIMINGS.open.dur, TIMINGS.open.marks.slow) + 1].match(/hello world (\d+)$/)[1];

/* ---------- layout ---------- */
const MONO = ROOMS.mono;
const SCR = [300, 100, 1000, 562];                        // open: the monitor's screen (x, y, w, h) in the desk world
const TERM = { w: 470, y: 112, h: 538, bar: 40, rows: 20, pad: 14 }, TERM_X = { talker: 314, listener: 816 };
const ROW_H = (TERM.h - TERM.bar - 20) / TERM.rows;
const TERM_FS = (() => { ctx2d.font = `20px ${MONO}`; const w = ctx2d.measureText(termLine('listener', 295)).width; return Math.min(16, 20 * (TERM.w - 2 * TERM.pad) / w); })();
const rowY = i => TERM.y + TERM.bar + 10 + (i + .74) * ROW_H;
// open's push shows the inside as one baked picture (baked from this page; bake it again after a change to
// rooms.js or robots.js), decoded at load so its first frame does not stall
const ROOMS_BAKED = '../img/ch04-rooms@2x.png';
{ const im = new Image(); im.src = ROOMS_BAKED; if (im.decode) im.decode().catch(() => {}); }
const INSIDE = { x: 480, y: 201, s: .4 };                  // the rooms behind the screen: the stage at .4, centred on it
const DESK_VIEW = { x: 800, y: 450, z: 1 }, SCREEN_VIEW = { x: 800, y: 381, z: 1.42 }, INSIDE_VIEW = { x: 800, y: 381, z: 1 / INSIDE.s };
const FLOOR = ROOMS.floor, ROB_S = .9, TK_X = 200, LS_X = 1400;
const TUBE = { x0: 400, x1: 1200, y: 630, h: 96 };
const WIDE = { x: 800, y: 450, z: 1 }, CLOSE = { x: 515, y: 600, z: 1.95 };   // close: talker, its mouth, the slip, the plate
const X_STOP = 586, X_CREEP = 596;                        // where the slip is looked at, opened and closed

/* ---------- small helpers ---------- */
const clamp01 = q => Math.max(0, Math.min(1, q));
const popIn = (e, t, d = .45) => { put(e, { o: 0, s: .6 }); tw(e, { o: 1, s: 1 }, t, d, back); return e; };
const fadeIn = (e, t, d = .4) => { put(e, { o: 0 }); tw(e, { o: 1 }, t, d); return e; };
// A rounded label: main word bold, an optional second word lighter, and a pointer `point` long on one side
// ('down', 'up', 'left' or 'right'), `px` from that side's middle.
function pill(p, main, sub, { x, y, bg, ink = '#fff', size = 28, point = 0, side = 'down', px = 0, line } = {}) {
  const g = G(p, { x, y, o: 0 });
  ctx2d.font = `700 ${size}px ${UI}`; const w1 = ctx2d.measureText(main).width;
  ctx2d.font = `500 ${size * .82}px ${UI}`; const w2 = sub ? ctx2d.measureText(' ' + sub).width : 0;
  const w = w1 + w2 + size * 1.1, h = size * 1.55, k = side === 'up' ? -1 : 1, attrs = { fill: bg, stroke: line || 'none', 'stroke-width': 3 };
  const sx = side === 'right' ? -1 : 1;   // left and right: the same pointer, mirrored
  if (point) path(g, side === 'left' || side === 'right' ? `M${sx * (-w / 2 + 4)} ${px - 12}L${sx * (-w / 2 - point)} ${px}L${sx * (-w / 2 + 4)} ${px + 12}Z`
    : `M${px - 13} ${k * (h / 2 - 2)}L${px} ${k * (h / 2 + point)}L${px + 13} ${k * (h / 2 - 2)}Z`, attrs);
  mk('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, ...attrs }, g);
  if (point && line) path(g, side === 'left' || side === 'right' ? `M${sx * (-w / 2 + 5.5)} ${px - 10}V${px + 10}` : `M${px - 11} ${k * (h / 2 - 1.5)}H${px + 11}`, { stroke: bg, 'stroke-width': 4 });
  const t = put(mk('text', { 'font-size': size, 'font-weight': 700, 'font-family': UI, fill: ink }, g), { x: -w / 2 + size * .55, y: size * .36 });
  t.textContent = main; t.style.whiteSpace = 'pre';
  if (sub) { const ts = mk('tspan', { 'font-size': size * .82, 'font-weight': 500 }, t); ts.textContent = ' ' + sub; }
  return Object.assign(g, { w });
}

// The rooms and both robots, idle, in layers: set, tube, what hands hold, the cast, labels on top.
function stage(w, D, { still = false } = {}) {   // still: robots drawn once as at t = 0 (pubsub's first frame), no per-frame writes
  const L = { set: G(w), tube: G(w), hold: G(w), cast: G(w), top: G(w) }, how = still ? { still: 0 } : {};
  const set = rooms(L.set);
  const tk = robot(L.cast, 'talker', { x: TK_X, y: FLOOR, s: ROB_S }).eyes(0, .6, .2).live(D, how);
  const ls = robot(L.cast, 'listener', { x: LS_X, y: FLOOR, s: ROB_S }).eyes(0, -.6, .2).live(D, how);
  return { L, set, tk, ls };
}

/* ---------- open: the desk, the monitor, two terminals ---------- */
function deskScene(w) {
  mk('rect', { x: -200, y: -100, width: 2000, height: 1100, fill: '#f3ebdd' }, w);    // the classroom wall
  mk('rect', { x: -200, y: 540, width: 2000, height: 240, fill: '#ece1cf' }, w);
  mk('rect', { x: -200, y: 532, width: 2000, height: 9, fill: '#dccdb4' }, w);
  path(w, 'M70 770H1530L1600 852H0Z', { fill: '#d9b27c', stroke: 'none' });             // the desk, seen a little from above
  path(w, 'M80 775H1520', { stroke: '#e4c08e', 'stroke-width': 6 });
  mk('rect', { x: 0, y: 852, width: 1600, height: 60, fill: '#b98a52' }, w);
  mk('rect', { x: 770, y: 688, width: 60, height: 74, fill: '#57514b' }, w);            // the monitor's stand
  path(w, 'M664 782Q664 760 694 760H906Q936 760 936 782Z', { fill: '#47423e', stroke: 'none' });
  path(w, 'M556 796H1044L1066 842H534Z', { fill: '#efe9df', stroke: '#bfb6a8', 'stroke-width': 3 });   // keyboard
  let keys = ''; [808, 822].forEach(y => { for (let x = 570; x < 1036; x += 26) keys += `M${x} ${y}h14`; });
  path(w, keys + 'M680 834H920', { stroke: '#cfc6b8', 'stroke-width': 7 });
  path(w, 'M1150 812Q1150 790 1172 790Q1194 790 1194 812Q1194 836 1172 836Q1150 836 1150 812Z', { fill: '#efe9df', stroke: '#bfb6a8', 'stroke-width': 3 });   // mouse
  const mug = G(w, { x: 1330, y: 838 });                                                 // a mug
  path(mug, 'M30 -52Q58 -52 58 -32Q58 -12 30 -14', { stroke: '#2f8f83', 'stroke-width': 9, fill: 'none' });
  path(mug, 'M-32 -66H34L30 0H-28Z', { fill: '#3ca596', stroke: 'none' });
  mk('rect', { x: -34, y: -70, width: 70, height: 10, rx: 4, fill: '#2f8f83' }, mug);
}
function bezel(p) {
  const w = G(p), [x, y, ww, h] = SCR, b = 28, o = `M${x - b + 24} ${y - b}H${x + ww + b - 24}Q${x + ww + b} ${y - b} ${x + ww + b} ${y - b + 24}V${y + h + b - 24}Q${x + ww + b} ${y + h + b} ${x + ww + b - 24} ${y + h + b}H${x - b + 24}Q${x - b} ${y + h + b} ${x - b} ${y + h + b - 24}V${y - b + 24}Q${x - b} ${y - b} ${x - b + 24} ${y - b}Z`;
  path(w, `${o}M${x} ${y}V${y + h}H${x + ww}V${y}Z`, { fill: '#3a3633', stroke: 'none', 'fill-rule': 'evenodd' });
  mk('circle', { cx: x + ww / 2, cy: y + h + 14, r: 4, fill: '#9fd48a' }, w);
  return w;
}
// The inside of the computer seen through the screen around the rooms: a few gold traces (revealed with the rooms).
function screenTraces(w) {
  const g = G(w, { o: 0 }), { x, y, s } = INSIDE, x1 = x + 1600 * s, y1 = y + 900 * s;
  path(g, `M${SCR[0] + 30} ${y + 60}H${x - 40}L${x - 10} ${y + 90}H${x}M${SCR[0] + 50} ${y1 - 50}H${x - 60}L${x - 30} ${y1 - 20}H${x}` +
    `M${SCR[0] + SCR[2] - 30} ${y + 80}H${x1 + 40}L${x1 + 10} ${y + 110}H${x1}M${SCR[0] + SCR[2] - 40} ${y1 - 70}H${x1 + 50}L${x1 + 20} ${y1 - 40}H${x1}` +
    `M${x + 120} ${SCR[1] + 30}V${y}M${x1 - 160} ${SCR[1] + 20}V${y}M${x + 200} ${SCR[1] + SCR[3] - 24}V${y1}M${x1 - 120} ${SCR[1] + SCR[3] - 30}V${y1}`,
  { stroke: '#8a7040', 'stroke-width': 3 });
  mk('rect', { x: x - 6, y: y - 6, width: 1600 * s + 12, height: 900 * s + 12, rx: 10, fill: 'none', stroke: '#8a7040', 'stroke-width': 4 }, g);
  return g;
}
// One terminal window, its rows rewritten from the beat clock whenever talker's line count changes.
function terminal(p, who, D, ts) {
  const x = TERM_X[who], C = ROBOT[who], g = G(p);
  mk('rect', { x, y: TERM.y, width: TERM.w, height: TERM.h, rx: 10, fill: '#262321' }, g);
  path(g, `M${x} ${TERM.y + TERM.bar}V${TERM.y + 10}Q${x} ${TERM.y} ${x + 10} ${TERM.y}H${x + TERM.w - 10}Q${x + TERM.w} ${TERM.y} ${x + TERM.w} ${TERM.y + 10}V${TERM.y + TERM.bar}Z`, { fill: '#3d3936', stroke: 'none' });
  const title = T(g, 'Terminal', { x: x + TERM.w / 2, y: TERM.y + 27, size: 17, fill: '#b9b1a6', anchor: 'middle' });
  const name = G(g, { o: 0 });
  path(name, `M${x} ${TERM.y + TERM.bar}V${TERM.y + 10}Q${x} ${TERM.y} ${x + 10} ${TERM.y}H${x + TERM.w - 10}Q${x + TERM.w} ${TERM.y} ${x + TERM.w} ${TERM.y + 10}V${TERM.y + TERM.bar}Z`, { fill: C.body, stroke: 'none' });
  T(name, C.name, { x: x + 18, y: TERM.y + 29, size: 25, weight: 700, fill: '#fff', font: MONO });
  const note = G(g, { o: 0 });
  T(note, who === 'talker' ? '每 0.1 秒印一行' : '跟著印出 I heard', { x: x + TERM.w - 92, y: TERM.y + 28, size: 18, weight: 600, fill: '#fff', anchor: 'end' });
  [0, 1, 2].forEach(k => mk('circle', { cx: x + TERM.w - 62 + k * 21, cy: TERM.y + 20, r: 7, fill: k === 2 ? '#e8743b' : '#6b645d' }, g));
  const outline = put(mk('rect', { x: x - 3, y: TERM.y - 3, width: TERM.w + 6, height: TERM.h + 6, rx: 12, fill: 'none', stroke: C.body, 'stroke-width': 6 }, g), { o: 0 });
  const rows = [...Array(TERM.rows)].map((_, i) => T(g, '', { x: x + TERM.pad, y: rowY(i), size: TERM_FS, font: MONO, fill: '#ece6da' }));
  const dim = put(mk('rect', { x: x + 4, y: TERM.y + TERM.bar + 2, width: TERM.w - 8, height: rowY(TERM.rows - 2) - TERM.y - TERM.bar + 4, fill: '#262321' }, g), { o: 0 });   // [[ask]]: the older rows step back
  let last = -1;
  clockRun(t => {
    const c = printedBy(t, ts); if (c === last) return; last = c;
    const k = who === 'talker' ? c : Math.max(0, c - 1), total = 1 + k, first = Math.max(0, total - TERM.rows);
    rows.forEach((r, i) => {
      const j = first + i, str = j >= total ? '' : j === 0 ? CAPTURED[who][0] : termLine(who, who === 'talker' ? j - 1 : j);
      if (r.textContent !== str) r.textContent = str;
    });
  }, D);
  return { g, title, name, note, outline, dim, x };
}
// The newest line on each side boxed where its hello world N sits, a dashed arc from one to the other that draws
// dash by dash (reveal(q), q 0..1, a pure function of the beat clock), its head, and a ? on it. All parts start hidden.
function askArc(p) {
  const g = G(p), y = rowY(TERM.rows - 1);
  ctx2d.font = `${TERM_FS}px ${MONO}`;
  const box = who => {
    const line = termLine(who, 150), i = line.indexOf('hello world'), x = TERM_X[who] + TERM.pad + ctx2d.measureText(line.slice(0, i)).width;
    const wd = ctx2d.measureText('hello world 150').width;
    const b = put(mk('rect', { x: x - 5, y: y - TERM_FS - 3, width: wd + 10, height: TERM_FS + 12, rx: 5, fill: ROOMS.yellow, 'fill-opacity': .22, stroke: ROOMS.yellow, 'stroke-width': 3 }, g), { o: 0 });
    return [b, x + wd / 2, y - TERM_FS - 5];
  };
  const [boxT, ax, ay] = box('talker'), [boxL, bx, by] = box('listener'), cx = 720, cy = ay - 290;
  const at = u => [(1 - u) ** 2 * ax + 2 * u * (1 - u) * cx + u * u * bx, (1 - u) ** 2 * ay + 2 * u * (1 - u) * cy + u * u * by];
  // sample the curve by length, then cut it into 14 px dashes with 11 px gaps
  const pts = [[0, ...at(0)]];
  for (let k = 1; k <= 400; k++) { const [x, yy] = at(k / 400), [l0, x0, y0] = pts[k - 1]; pts.push([l0 + Math.hypot(x - x0, yy - y0), x, yy]); }
  const L = pts[400][0], ptAt = l => { const k = pts.findIndex(q => q[0] >= l); return k <= 0 ? pts[0].slice(1) : pts[k].slice(1); };
  const dashes = [];
  for (let l = 0; l < L - 4; l += 25) {
    const a0 = ptAt(l), a1 = ptAt(Math.min(L, l + 14));
    dashes.push([l / L, mk('path', { d: `M${a0[0].toFixed(1)} ${a0[1].toFixed(1)}L${a1[0].toFixed(1)} ${a1[1].toFixed(1)}`, stroke: ROOMS.yellow, 'stroke-width': 5, display: 'none' }, g)]);
  }
  const ang = Math.atan2(by - cy, bx - cx);
  const head = path(g, `M${bx - 20 * Math.cos(ang - .45)} ${by - 20 * Math.sin(ang - .45)}L${bx} ${by}L${bx - 20 * Math.cos(ang + .45)} ${by - 20 * Math.sin(ang + .45)}`, { stroke: ROOMS.yellow, 'stroke-width': 5 }, { o: 0 });
  const q = G(g, { x: (ax + 2 * cx + bx) / 4, y: (ay + 2 * cy + by) / 4 - 6, o: 0 });
  mk('circle', { r: 42, fill: ROOMS.yellow, stroke: '#1d1b1a', 'stroke-width': 5 }, q);
  T(q, '?', { x: 0, y: 20, size: 58, weight: 800, fill: ROOMS.ink, anchor: 'middle' });
  let shown = -1;
  const reveal = r => { const n = dashes.filter(([f]) => f < r).length; if (n === shown) return; shown = n; dashes.forEach(([, d], i) => d.setAttribute('display', i < n ? 'inline' : 'none')); };
  return { g, boxT, boxL, head, q, reveal };
}

/* ---------- the rest of the chapter: layout, code, helpers ---------- */
const TALK_VIEW = { x: 571, y: 470, z: 1.4 }, LIS_VIEW = { x: 1029, y: 470, z: 1.4 }, DROP_VIEW = { x: 985, y: 500, z: 1.3 };
const GAP_VIEW = { x: 1000, y: 600, z: 1.5 };                  // typo: the two tubes that do not meet
const INBOX = { x: 1000, y: 770, n: 10, w: 244 };            // listener's queue under its mouth piece; its basket (front end) clear of its hand
const WRITE_SPOT = [520, 520], READ_SPOT = [1080, 520];      // where a message is filled in / read, over the tube
// The code on screen: lines of talker.py and listener.py as in the files (codeLine), never retyped
const TIMER_CODE = ['create_timer', '⋮', 'def on_timer', 'msg = String()', 'msg.data =', 'get_logger().info(msg.data)', 'self.pub.publish', 'self.count += 1']
  .map(k => k === '⋮' ? k : codeLine('talker', k));
const SPIN_CODE = ['def on_timer', '⋮', 'def main', 'try:', 'rclpy.init()', 'node = Talker()', 'rclpy.spin(node)'].map(k => k === '⋮' ? k : codeLine('talker', k));
const RECV_CODE = [codeLine('listener', 'create_subscription'), '⋮', codeLine('listener', 'def on_message'), codeLine('listener', "info(f'I heard")];
const DROP_CODE = [codeLine('talker', 'create_publisher'), codeLine('listener', 'create_subscription')];
const SLOW_RATE_T = 1.25;   // late and typo: messages a second on screen, slowed down from the real ten (factor computed)
const LISTEN_LINES = CAPTURED.listener.map(shortTs), LATE_TALKER = CAPTURED.lateTalker.map(shortTs), LATE_LISTENER = CAPTURED.lateListener.map(shortTs);
const LATE_FIRST = +LATE_LISTENER[1].match(/hello world (\d+)\]$/)[1];   // 50: the first message the late listener heard
// q1: the timer's period, read from the code, and the changed one asked about; every option computed
const TIMER_PERIOD = +codeLine('talker', 'create_timer').match(/create_timer\(([\d.]+)/)[1];   // 0.1
const Q1_PERIOD = .5, Q1_RATE = 1 / Q1_PERIOD;
const Q1_LINE = codeLine('talker', 'create_timer').replace(`(${TIMER_PERIOD},`, `(${Q1_PERIOD},`);
const Q1_OPTS = [...new Set([Q1_PERIOD, Q1_RATE, Q1_PERIOD * 10, 1 / TIMER_PERIOD])].sort((a, b) => a - b);
// Card texts are bi(Chinese, English): the card shows the English with English captions on (C)
const Q1_WHY = {
  [Q1_PERIOD]: bi(`${Q1_PERIOD} 是兩次之間隔幾秒，不是每秒幾則：1 秒裡有 1 ÷ ${Q1_PERIOD} = ${Q1_RATE} 個 ${Q1_PERIOD} 秒。`,
    `${Q1_PERIOD} is the number of seconds between two messages, not messages per second: 1 second holds 1 ÷ ${Q1_PERIOD} = ${Q1_RATE} periods of ${Q1_PERIOD} s.`),
  [Q1_PERIOD * 10]: bi(`不是 ${Q1_PERIOD} × 10：間隔變長，每秒送得更少。1 ÷ ${Q1_PERIOD} = ${Q1_RATE}。`,
    `Not ${Q1_PERIOD} × 10: a longer interval means fewer messages per second. 1 ÷ ${Q1_PERIOD} = ${Q1_RATE}.`),
  [1 / TIMER_PERIOD]: bi(`每秒 ${1 / TIMER_PERIOD} 則是每 ${TIMER_PERIOD} 秒響一次的時候；改成 ${Q1_PERIOD} 秒以後，1 ÷ ${Q1_PERIOD} = ${Q1_RATE}。`,
    `${1 / TIMER_PERIOD} per second is when it goes off every ${TIMER_PERIOD} s; at ${Q1_PERIOD} s, 1 ÷ ${Q1_PERIOD} = ${Q1_RATE}.`),
};
// typo and q2: listener's topic name misspelt (one t gone) or capitalised: its own line with only the name changed
const TOPIC = codeLine('listener', 'create_subscription').match(/'(\w+)'/)[1];          // chatter
const TYPO = TOPIC.replace('tt', 't'), CAPS = TOPIC[0].toUpperCase() + TOPIC.slice(1);   // chater, Chatter
const nameLine = name => codeLine('listener', 'create_subscription').replace(`'${TOPIC}'`, `'${name}'`);
const CASE_SAME = CAPS === TOPIC;                                                        // false: names are case-sensitive
const Q1_CARD = { x: 990, y: 36, w: 590, cls: 'side', maxH: 600 };    // q1: over listener's side (it may cover the plate's top); the clock and the code in sight
const Q2_CARD = { x: 30, y: 24, w: 1040, cls: 'side', maxH: 420 };    // q2: across the top of both walls, above the plates and the antennas

// receive's and late's last pictures, worked out from their own clocks (TIMINGS, the same rules as those beats), for
// the beats after them to open on and fade (the camera does not cut between them)
const MOUTH_T = TUBE.x0 - 52, MOUTH_L = TUBE.x1 + 52;   // the two mouth pieces' openings (roomsBell's horn is 52 long)
const RECV_END = (() => {

  const lines = NEXT_N + 1 + Math.max(0, Math.floor((end - ta0 - TIMER_PERIOD) / TIMER_PERIOD) + 1), slips = [];
  for (let k = 0; te(k) <= end; k++) { const x = MOUTH_T + (end - te(k)) * V; if (x <= MOUTH_L - 20) slips.push(x); }

  const arrive = n => te(n) + (MOUTH_L - MOUTH_T) / v, slips = [];

function world(w, D, { pills = true, topic = false, inbox = false } = {}) {
  const st0 = stage(w, D), { L } = st0;
  const tube = roomsTube(L.tube, TUBE);
  const bell = (side, x, who) => roomsBell(L.tube, side, { x, y: TUBE.y, h: TUBE.h, color: ROBOT[who].body, dark: ROBOT[who].dark, light: ROBOT[who].light });
  const bellT = bell(-1, TUBE.x0, 'talker'), bellL = bell(1, TUBE.x1, 'listener');
  const pubL = pill(L.top, 'publish', '送出', { x: 395, y: 530, bg: ROBOT.talker.body, size: 28, point: 12, px: TUBE.x0 - 26 - 395 });
  const subL = pill(L.top, 'subscribe', '訂閱', { x: 1185, y: 530, bg: ROBOT.listener.body, size: 28, point: 12, px: TUBE.x1 + 26 - 1185 });
  const topicW = pill(L.top, 'topic', null, { x: 800, y: 408, bg: '#fffdf8', ink: ROOMS.violet, line: ROOMS.violet, size: 28 });
  put(pubL, { o: pills ? 1 : 0 }); put(subL, { o: pills ? 1 : 0 }); put(topicW, { o: topic ? 1 : 0 });
  const box = inbox ? roomsInbox(L.tube, INBOX) : null;

}
// Messages one after another down the tube: message k leaves at te(k) and travels at v px/s, showing while inside
// [xa, xb] (fading over the last `fade` px). A pure function of t, from a reused pool. tag(k) labels a slip (its number).
function slipStream(layer, D, { te, k0, k1, v, xa, xb, y = TUBE.y, s = .55, max = 14, fade = 60, tag }) {
  const pool = [...Array(max)].map(() => ({ e: roomsSlip(layer, { o: 0, y, s }), t: tag ? T(layer, '', { y: y - 34, size: 24, weight: 800, fill: ROOMS.ink, anchor: 'middle', o: 0 }) : null }));
  clockRun(t => {
    const on = new Set();
    for (let k = k0; k <= k1; k++) {
      const x = xa + (t - te(k)) * v; if (x < xa || x > xb) continue;
      const j = ((k % max) + max) % max, op = Math.min(1, (xb - x) / fade, (x - xa) / 20 + .3);
      on.add(j); put(pool[j].e, { o: op, x });
      if (pool[j].t) { const str = tag(k); if (pool[j].t.textContent !== str) pool[j].t.textContent = str; put(pool[j].t, { o: op, x }); }
    }
    pool.forEach((q, j) => { if (!on.has(j)) { put(q.e, { o: 0, x: 0 }); if (q.t) { put(q.t, { o: 0, x: 0 }); if (q.t.textContent) q.t.textContent = ''; } } });   // hidden: blank, as a seek finds it
  }, D, { tail: true });
  return pool;
}
// A curved arrow from a to b, bending towards c; arrow.drawAt(t0, dur) draws it on and shows its head on arrival.
function curveArrow(p, [ax, ay], [cx, cy], [bx, by], { color = ROOMS.ink, width = 5 } = {}) {
  const g = G(p), ang = Math.atan2(by - cy, bx - cx);
  const line = path(g, `M${ax} ${ay}Q${cx} ${cy} ${bx} ${by}`, { stroke: color, 'stroke-width': width }, { d: 0 });
  const head = path(g, `M${bx - 18 * Math.cos(ang - .5)} ${by - 18 * Math.sin(ang - .5)}L${bx} ${by}L${bx - 18 * Math.cos(ang + .5)} ${by - 18 * Math.sin(ang + .5)}`, { stroke: color, 'stroke-width': width }, { o: 0 });
  return Object.assign(g, { line, head, drawAt(t0, dur = .6) { draw(line, t0, dur); tw(head, { o: 1 }, t0 + dur - .1, .15); return g; } });
}
// A red cross over something that will not happen (hidden; o 0)
const crossOut = (p, x, y, r = 40) => put(path(p, `M${x - r} ${y - r}L${x + r} ${y + r}M${x + r} ${y - r}L${x - r} ${y + r}`, { stroke: '#e0503f', 'stroke-width': 10 }), { o: 0 });
// A numbered step of the route: a disc with its number, the words in a pill beside it (right, or left) (hidden)
function stepTag(p, k, words, { x, y, color = ROOMS.ink, size = 32, side = 'right' }) {
  const g = G(p, { x, y, o: 0 }), r = size * .95;
  const pl = pill(g, words, null, { x: 0, y: 0, bg: '#fffdf8', ink: ROOMS.ink, line: color, size });
  put(pl, { o: 1, x: (side === 'left' ? -1 : 1) * (pl.w / 2 + r * .7) });
  mk('circle', { r, fill: color, stroke: '#fffdf8', 'stroke-width': 4 }, g);
  T(g, String(k), { y: size * .36, size: size * 1.05, weight: 800, fill: '#fff', anchor: 'middle' });
  return g;
}

// xr its right edge on the stage, y its middle.
function slowBadge(p, spans, { xr = 1584, y = 46, line } = {}) {

}
