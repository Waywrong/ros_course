'use strict';
// Chapter 5, tier 2: from colcon build to ros2 run. open: talker's room from chapter 4, the terminal where we ran it;
// how did that one line find talker, and where does "Package not found" come from? Then a workshop and warehouses
// inside the computer: src is a workbench (package.xml the name card, setup.py the work order, the code folder a crate
// of parts); colcon build is a machine that turns them into finished goods on the install shelves (build/ a bin of
// offcuts, log/ a clipboard); console_scripts makes the machine stamp out a launcher box on lib/w04_pubsub, wired to
// talker.py's main; source pins the warehouse's address on a list board (AMENT_PREFIX_PATH); a small grey helper robot
// plays ros2 run: it carries the command card, reads the list, checks the package's name tag (the ament index marker),
// finds the launcher box and presses it, and talker wakes. The two error messages are its two misses; --symlink-install
// is the wire running back to the part on the bench.
const CHAPTER = { number: 5, title: '從 colcon build 到 ros2 run', minutes: 7, language: 'zh-TW', languages: ['en'] };   // English: captions.en.js and the cards (bi)

/* ---------- the real terminal output and the course's files (captured.js, generated from the real captures) ---------- */
const shortTs = line => line.replace(/\[\d+\.\d+\]/, '[…]');   // the page shortens the timestamp to […]
// A terminal wraps a long line at its width: the same text cut every `cols` characters, as the screen shows it
const wrapCols = (lines, cols) => lines.flatMap(l => { const out = []; for (let i = 0; i < Math.max(1, l.length); i += cols) out.push(l.slice(i, i + cols)); return out; });
const CMD = CAPTURED.runBeforeBuild[0];                                   // $ ros2 run w04_pubsub talker
const [, RUN, PKG, EXE] = CMD.match(/^\$ (ros2 run) (\S+) (\S+)$/);        // ros2 run, w04_pubsub, talker
const CMD2 = CAPTURED.runNoExec[0], EXE2 = CMD2.match(/ros2 run \S+ (\S+)$/)[1];   // the run with a name not in setup.py: talker2
const NOT_FOUND = CAPTURED.runBeforeSource[1], NO_EXEC = CAPTURED.runNoExec[1];
const SOURCE_CMD = CAPTURED.sourceCmd, SOURCE_LINE = SOURCE_CMD.replace(/^\$ /, '');
const PREFIX_BEFORE = CAPTURED.prefixBefore[1].split(':'), PREFIX_AFTER = CAPTURED.prefixAfter[1].split(':');
const WS_PREFIX = PREFIX_AFTER.find(x => !PREFIX_BEFORE.includes(x)), ROS_PREFIX = PREFIX_BEFORE[0];   // the workspace's install, /opt/ros/jazzy
const INSTALL_DIR = WS_PREFIX.match(/(install\/[^/]+)$/)[1];             // install/w04_pubsub
const WS_HOME = FILES.bashrc.match(/(~\/\S+?)\/install\/setup\.bash/)[1];   // ~/ros2_ws, where the course's .bashrc sources from
const inPrefix = cmd => cmd.match(/install\/[^/]+\/(\S+)$/)[1];
const LIB_DIR = inPrefix(CAPTURED.installLib[0]), MARK_DIR = inPrefix(CAPTURED.marker[0]);   // lib/w04_pubsub, share/ament_index/…/packages
const EGG_PATH = inPrefix(CAPTURED.eggLink[0]), EGG_DIR = EGG_PATH.replace(/\/[^/]+$/, ''), EGG_FILE = EGG_PATH.replace(/^.*\//, '');
const EXES = CAPTURED.installLib.slice(1), MARKER = CAPTURED.marker[1];  // listener, talker; the name tag w04_pubsub
const PKG_NAME = FILES['package.xml'].map(l => l.match(/<name>(.*)<\/name>/)).find(Boolean)[1];
const DEPENDS = FILES['package.xml'].map(l => l.match(/<exec_depend>(.*)<\/exec_depend>/)).filter(Boolean).map(r => r[1]);
// console_scripts: each line 'name = module:function'
const SETUP = FILES['setup.py'], ENTRY_A = SETUP.findIndex(l => l.includes('entry_points')), ENTRY_B = SETUP.findIndex((l, i) => i > ENTRY_A && /^\s*},/.test(l));
const ENTRY_LINES = SETUP.slice(ENTRY_A, ENTRY_B + 1);
const SCRIPTS = ENTRY_LINES.map(l => l.match(/'(\w+) = ([\w.]+):(\w+)'/)).filter(Boolean).map(([line, name, module, func]) => ({ line, name, module, func, file: module.split('.').pop() + '.py' }));
const TK_SCRIPT = SCRIPTS.find(s => s.name === EXE), LS_SCRIPT = SCRIPTS.find(s => s.name !== EXE);
const CS_LINES = ENTRY_LINES.slice(0, ENTRY_LINES.findIndex(l => l.includes(LS_SCRIPT.line)) + 1);   // entry_points down to listener's line
const TALKER_DEFS = FILES[TK_SCRIPT.file].map(l => l.match(/^\s*def (\w+)\(/)).filter(Boolean).map(r => r[1]);   // __init__, on_timer, main
const SETUP_DEFS = SETUP.map(l => l.match(/^\s*def (\w+)\(/)).filter(Boolean).map(r => r[1]);                    // none
// the code folder: the files the find listing shows under src/w04_pubsub/w04_pubsub/
const CODE_DIR = `src/${PKG}/${PKG}/`, CODE_FILES = CAPTURED.srcTree.filter(l => l.startsWith(CODE_DIR)).map(l => l.slice(CODE_DIR.length));
const COLCON_S = +CAPTURED.colcon.find(l => l.startsWith('Finished')).match(/\[([\d.]+)s\]/)[1];   // 0.64 s: the build itself
// talker's printed lines in the capture: their real rate, from the timestamps
const TALK_TS = CAPTURED.runTalker.map(l => l.match(/\[(\d+\.\d+)\]/)).filter(Boolean).map(r => +r[1]);
const TALK_RATE = (TALK_TS.length - 1) / (TALK_TS[TALK_TS.length - 1] - TALK_TS[0]);   // about 10 a second
// q2: the console_scripts line a new program would add, from talker's own line
const Q2_EXE = 'counter', Q2_LINE = ENTRY_LINES.find(l => l.includes(TK_SCRIPT.line)).replaceAll(EXE, Q2_EXE);
// setup.py's lines on screen in src: name, packages, data_files, entry_points (⋮ where lines are skipped)
const setupPick = keys => { const idx = keys.map(k => SETUP.findIndex(l => l.trim().startsWith(k))), out = []; idx.forEach((i, j) => { if (j && i > idx[j - 1] + 1) out.push('⋮'); out.push(SETUP[i]); }); return out; };
const SETUP_SHOW = setupPick(['name=', 'packages=', 'data_files=', 'entry_points=']);
const XML_SHOW = FILES['package.xml'].filter(l => /<name>|<exec_depend>/.test(l));

/* ---------- the world: one long hall, in world coordinates (shown through a camera) ---------- */
const FLOOR = ROOMS.floor;
const BENCH = { x: 40, w: 760, top: 560 }, CARD_X = 150, ORDER_X = 345, CRATE = { x: 612, w: 360 };
const MACH = { x: 880, w: 320, h: 330 }, BIN = { x: 1262, w: 100 }, CLIP = { x: 1312, y: 412 };
const WH = { x: 1400, w: 500, top: 330, levels: [470, 640, 752] };          // install/w04_pubsub
const TAG_AT = [1560, 345], BOX_X = { listener: 1493, talker: 1650 }, NEW_SLOT = 1807, EGG_AT = [1560, 752], BOX = { w: 140, h: 80, size: 26 };
const TK_SPOT = 2140, TK_S = .85;                                            // talker, asleep beside the warehouse, clear of the helper's card
const TERM_W = { x: 2100, y: 60, w: 600, rows: 4, size: 30 }, HOME_X = 2400, HELP_S = .78;
const BOARD = { x: 2040, y: 300, w: 720, size: 26, cardSize: 28 };          // its cards are read in wide shots: 28 px
const JZ = { x: 2800, w: 540, top: 300, levels: [470, 640] }, JZ_TAGS = [[2890, DEPENDS[0]], [3065, DEPENDS[1]], [3235, '…']];
// the helper presses a box with its L hand from the box's right, the card in its R hand; it stands so that hand meets the button
const PRESS_DX = (() => { const [, , , , hx] = robotArm(-1, ROBOT_POSE.pressL.L); return -hx * HELP_S; })();
const PRESS_X = BOX_X.talker + PRESS_DX, TAG_X = TAG_AT[0] + 120, JZ_X = 2990;
// views
const SHOP_WIDE = { x: 975, y: 450, z: .84 }, BENCH_VIEW = { x: 680, y: 420, z: 1.25 };
const SHELF_VIEW = { x: 1480, y: 540, z: 1.3 }, LINK_VIEW = { x: 1100, y: 520, z: .95 };   // entry's lib shelf; symlink's whole wire
const MID_VIEW = { x: 2080, y: 450, z: 1.15 }, TAG_VIEW = { x: 1730, y: 520, z: 1.55 }, DISTRICT = { x: 2370, y: 450, z: .82 };
const E2_VIEW = { x: 1990, y: 455, z: 1.1 };                                            // errors' second miss: the lib shelf, the helper, talker (the terminal's title bar in the frame)

/* ---------- small helpers (as in ch04) ---------- */
const clamp01 = q => Math.max(0, Math.min(1, q));
const popIn = (e, t, d = .45) => { put(e, { o: 0, s: .6 }); tw(e, { o: 1, s: 1 }, t, d, back); return e; };
const fadeIn = (e, t, d = .4) => { put(e, { o: 0 }); tw(e, { o: 1 }, t, d); return e; };
const lerpPt = ([ax, ay], [bx, by], q) => [ax + (bx - ax) * q, ay + (by - ay) * q];
function pill(p, main, sub, { x, y, bg, ink = '#fff', size = 28, point = 0, side = 'down', px = 0, line, font = UI } = {}) {
  const g = G(p, { x, y, o: 0 });
  ctx2d.font = `700 ${size}px ${font}`; const w1 = ctx2d.measureText(main).width;
  ctx2d.font = `500 ${size * .82}px ${font}`; const w2 = sub ? ctx2d.measureText(' ' + sub).width : 0;
  const w = w1 + w2 + size * 1.1, h = size * 1.55, k = side === 'up' ? -1 : 1, attrs = { fill: bg, stroke: line || 'none', 'stroke-width': 3 };
  const sx = side === 'right' ? -1 : 1;
  if (point) path(g, side === 'left' || side === 'right' ? `M${sx * (-w / 2 + 4)} ${px - 12}L${sx * (-w / 2 - point)} ${px}L${sx * (-w / 2 + 4)} ${px + 12}Z`
    : `M${px - 13} ${k * (h / 2 - 2)}L${px} ${k * (h / 2 + point)}L${px + 13} ${k * (h / 2 - 2)}Z`, attrs);
  mk('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, ...attrs }, g);
  if (point && line) path(g, side === 'left' || side === 'right' ? `M${sx * (-w / 2 + 5.5)} ${px - 10}V${px + 10}` : `M${px - 11} ${k * (h / 2 - 1.5)}H${px + 11}`, { stroke: bg, 'stroke-width': 4 });
  const t = put(mk('text', { 'font-size': size, 'font-weight': 700, 'font-family': font, fill: ink }, g), { x: -w / 2 + size * .55, y: size * .36 });
  t.textContent = main; t.style.whiteSpace = 'pre';
  if (sub) { const ts = mk('tspan', { 'font-size': size * .82, 'font-weight': 500 }, t); ts.textContent = ' ' + sub; }
  return Object.assign(g, { w });
}
// A curved arrow from a to b, bending towards c; arrow.drawAt(t0, dur) draws it on and shows its head on arrival.
function curveArrow(p, [ax, ay], [cx, cy], [bx, by], { color = ROOMS.ink, width = 5 } = {}) {
  const g = G(p), ang = Math.atan2(by - cy, bx - cx);
  const line = path(g, `M${ax} ${ay}Q${cx} ${cy} ${bx} ${by}`, { stroke: color, 'stroke-width': width }, { d: 0 });
  const head = path(g, `M${bx - 18 * Math.cos(ang - .5)} ${by - 18 * Math.sin(ang - .5)}L${bx} ${by}L${bx - 18 * Math.cos(ang + .5)} ${by - 18 * Math.sin(ang + .5)}`, { stroke: color, 'stroke-width': width }, { o: 0 });
  return Object.assign(g, { line, head, drawAt(t0, dur = .6) { draw(line, t0, dur); tw(head, { o: 1 }, t0 + dur - .1, .15); return g; } });
}
const crossOut = (p, x, y, r = 40) => put(path(p, `M${x - r} ${y - r}L${x + r} ${y + r}M${x + r} ${y - r}L${x - r} ${y + r}`, { stroke: '#e0503f', 'stroke-width': 10 }), { o: 0 });
function checkMark(p, x, y, r = 30) {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r, fill: '#3f8a4d', stroke: '#fffdf8', 'stroke-width': 4 }, g);
  path(g, `M${-r * .48} 0L${-r * .12} ${r * .38}L${r * .52} ${-r * .38}`, { stroke: '#fff', 'stroke-width': r * .2 });
  return g;
}
function stepTag(p, k, words, { x, y, color = ROOMS.ink, size = 32, side = 'right', o = 0 }) {
  const g = G(p, { x, y, o }), r = size * .95;
  const pl = pill(g, words, null, { x: 0, y: 0, bg: '#fffdf8', ink: ROOMS.ink, line: color, size });
  put(pl, { o: 1, x: (side === 'left' ? -1 : 1) * (pl.w / 2 + r * .7) });
  mk('circle', { r, fill: color, stroke: '#fffdf8', 'stroke-width': 4 }, g);
  T(g, String(k), { y: size * .36, size: size * 1.05, weight: 800, fill: '#fff', anchor: 'middle' });
  return Object.assign(g, { pill: pl });
}
// 「放慢」: a small badge in screen space while the picture runs slower than real time, with the factor when it is
// constant. spans [[t0, t1, factor or null]], t1 null: to the beat's end
function slowBadge(p, spans, { xr = 1584, y = 46, line } = {}) {
  spans.forEach(([t0, t1, k]) => {
    const b = pill(p, '放慢', k ? `${Math.round(k)} 倍` : null, { x: 0, y, bg: '#3d3833', ink: '#fff', size: 24, line });
    put(b, { x: xr - b.w / 2 }); tw(b, { o: .92 }, t0, .3); if (t1 != null) tw(b, { o: 0 }, t1, .3);
  });
}
// What a terminal shows at beat time t. steps [t0, n, typing]: from t0 the first n lines, and with typing line n being
// typed after its '$ ' prompt (a short pause first, then CPS characters a second). Pure: from t alone.
function termAt(term, lines, steps, D, { cps = 26 } = {}) {
  clockRun(t => {
    let n = 0, k = 0;
    for (const [t0, nn, typing] of steps) if (t >= t0) { n = nn; k = typing ? Math.min(lines[nn].length, 2 + Math.max(0, Math.floor((t - t0 - .35) * cps))) : 0; }
    term.show(n, k);
  }, D, { tail: true });
  return term;
}
const typeEnd = (t0, line, cps = 26) => t0 + .35 + (line.length - 2) / cps;   // when typing that line is done
// an outline drawn round a panel (o 0): a terminal or code panel lit
const outline = (p, e, color, pad = 4) => put(mk('rect', { x: e.x - pad, y: e.y - pad, width: e.w + 2 * pad, height: e.h + 2 * pad, rx: 13, fill: 'none', stroke: color, 'stroke-width': 6 }, p), { o: 0 });
// the command card the helper carries: 'ros2 run' on a dark strip, then the package and the executable it looks for
function cmdCard(p, line, { o = 0 } = {}) {
  const [, run, pkg, exe] = line.match(/^\$ (ros2 run) (\S+) (\S+)$/), g = G(p, { o }), fs = 23;
  const w = Math.max(shopTextW(pkg, fs, 700), shopTextW(exe, fs, 700)) + 34, h = 112;
  mk('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 10, fill: SHOP.paper, stroke: SHOP.ink, 'stroke-width': 3 }, g);
  path(g, `M${-w / 2 + 1.5} ${-h / 2 + 34}V${-h / 2 + 10}Q${-w / 2 + 1.5} ${-h / 2 + 1.5} ${-w / 2 + 10} ${-h / 2 + 1.5}H${w / 2 - 10}Q${w / 2 - 1.5} ${-h / 2 + 1.5} ${w / 2 - 1.5} ${-h / 2 + 10}V${-h / 2 + 34}Z`, { fill: SCREENS.term, stroke: 'none' });
  shopText(g, run, { x: 0, y: -h / 2 + 24, size: 18, weight: 700, fill: '#9fe3a0', anchor: 'middle' });
  // not found (step 1 or step 2): the line turns red behind its text, a red mark sits on the card's edge beside it
  const miss = y => {
    const m = G(g, { o: 0 });
    mk('rect', { x: -w / 2 + 8, y: y - fs * .92, width: w - 16, height: fs * 1.3, rx: 6, fill: '#e0503f', 'fill-opacity': .3 }, m);
    const b = G(m, { x: w / 2, y: y - fs * .3 });
    mk('circle', { r: 17, fill: '#e0503f', stroke: '#fffdf8', 'stroke-width': 3 }, b);
    path(b, 'M-7 -7L7 7M7 -7L-7 7', { stroke: '#fff', 'stroke-width': 4.5 });
    return m;
  };
  const row = (str, y, col) => {
    const hi = put(mk('rect', { x: -w / 2 + 8, y: y - fs * .92, width: w - 16, height: fs * 1.3, rx: 6, fill: col, 'fill-opacity': .28 }, g), { o: 0 });
    const ms = miss(y);
    shopText(g, str, { x: 0, y, size: fs, weight: 700, anchor: 'middle' });
    return [hi, ms];
  };
  const [hiPkg, missPkg] = row(pkg, -h / 2 + 62, ROOMS.violet), [hiExe, missExe] = row(exe, -h / 2 + 96, ROBOT.talker.body);
  return Object.assign(g, { hiPkg, hiExe, missPkg, missExe, pkg, exe, w, h });
}
// the helper's shrug with its card still held up: the free arm and the head do it
const SHRUG_UP = { L: ROBOT_POSE.shrug.L, R: ROBOT_POSE.raiseR.R, head: 9 };
// a card that follows a robot's hand at every beat time (pure: from the hand's position at t)
function holdCard(rb, card, D, hand = 'R') {
  clockRun(t => { const [hx, hy] = rb.handAt(t, hand); put(card, { x: hx + (hand === 'R' ? 1 : -1) * (card.w / 2 - 18), y: hy - card.h / 2 + 12 }); }, D, { tail: true });
}
// a dotted line between two points (o 0)
const dotted = (p, [ax, ay], [bx, by], color = ROOMS.violet) => put(path(p, `M${ax} ${ay}L${bx} ${by}`, { stroke: color, 'stroke-width': 6, 'stroke-dasharray': '1 13' }), { o: 0 });

/* ---------- the hall and everything in it ---------- */
// built: the build's products (machine, bin, log, warehouse and its goods); board: null, 'before' or 'after';
// term: the lines of the terminal in the hall (null: none); helper: the helper robot (hidden until a beat shows it);
// wire: the cables drawn, at opacity wire (0 hidden); egg: the site-packages shelf with the egg-link (only symlink
// talks about it). Shelf labels start hidden: a beat shows the one it names.
function shopWorld(w, D, { built = true, board = 'after', term = null, helper = false, talker = true, wire = 1, jazzy = true, egg = false } = {}) {
  const L = { hall: G(w), back: G(w), mid: G(w), wires: G(w), goods: G(w), cast: G(w), front: G(w), top: G(w) };   // the wires run behind the goods: into a box, through the egg-link
  shopHall(L.hall, { x0: -800, x1: 4200, zones: [[1370, 4200, SHOP.wallCool]] });
  const banner = shopSign(L.back, WS_HOME, { x: 190, y: 100, size: 34, hang: true });
  const srcSign = shopSign(L.back, 'src/', { x: 120, y: 250, size: 34, hang: true });   // under the workspace's name: the path reads down
  // the bench: src (one group, so it can step back)
  const bench = G(L.mid);
  shopBench(bench, BENCH);
  const mat = shopMat(bench, { x: BENCH.x + 12, w: BENCH.w - 24, y: BENCH.top, label: `${PKG}/` }); put(mat.tab, { x: ORDER_X - 90 });
  const card = shopNameCard(bench, { x: CARD_X, y: BENCH.top - 2, name: PKG_NAME, note: `用到 ${DEPENDS.join('、')}` });
  const order = shopOrder(bench, { x: ORDER_X, y: BENCH.top - 2, title: 'setup.py', rows: 7 });
  const partColor = f => f.startsWith(EXE) ? ROBOT.talker.body : f.startsWith(LS_SCRIPT.name) ? ROBOT.listener.body : '#a2a8ae';
  const crate = shopCrate(bench, { x: CRATE.x, y: BENCH.top - 2, w: CRATE.w, label: `${PKG}/`, parts: CODE_FILES.map(f => ({ name: f, color: partColor(f) })) });
  const partOf = f => crate.partAt(CODE_FILES.indexOf(f));
  // the machine: colcon build, its belts, its bin (build/) and clipboard (log/)
  const prod = G(L.mid, { o: built ? 1 : 0 });
  const beltIn = shopBelt(prod, [BENCH.x + BENCH.w - 6, BENCH.top - 12], [MACH.x + 26, FLOOR - MACH.h - 64]);
  const machine = shopMachine(prod, { ...MACH, label: 'colcon build' });
  const beltOut = shopBelt(prod, [machine.chute[0] - 6, machine.chute[1] + 12], [WH.x - 10, machine.chute[1] + 12]);
  const bin = shopBin(prod, { ...BIN, label: 'build/' }), clip = shopClip(prod, { ...CLIP, label: 'log/' });
  put(bin.scraps, { o: built ? 1 : 0 }); put(clip.sheet, { o: built ? 1 : 0 });
  // the warehouse: install/w04_pubsub, its shelves and goods
  const wh = shopShelves(L.mid, { x: WH.x, w: WH.w, top: WH.top, sign: INSTALL_DIR, labels: false, levels: [{ y: WH.levels[0], label: MARK_DIR }, { y: WH.levels[1], label: LIB_DIR, align: 'start' }, { y: WH.levels[2], label: EGG_DIR }] });   // lib's path at the left: clear of the helper, who stands at the right
  put(wh, { o: built ? 1 : 0 }); put(wh.level(2).g, { o: egg ? 1 : 0 });
  const tag = shopTag(L.goods, { x: TAG_AT[0], y: TAG_AT[1], name: MARKER, note: `${FILES.marker.bytes} bytes`, size: 28, o: built ? 1 : 0 });
  const boxes = Object.fromEntries(EXES.map(n => { const C = ROBOT[n === EXE ? 'talker' : 'listener']; return [n, shopBox(L.goods, { x: BOX_X[n === EXE ? 'talker' : 'listener'], y: WH.levels[1], name: n, color: C.body, dark: C.dark, light: C.light, ...BOX, o: built ? 1 : 0 })]; }));
  const eggC = G(L.goods, { x: EGG_AT[0], y: EGG_AT[1], o: built && egg ? 1 : 0 });
  { const ew = shopTextW(EGG_FILE, 22) + 28; mk('rect', { x: -ew / 2, y: -44, width: ew, height: 44, rx: 5, fill: SHOP.paper, stroke: SHOP.steelDk, 'stroke-width': 3 }, eggC); shopText(eggC, EGG_FILE, { x: 0, y: -14, size: 22, anchor: 'middle' }); eggC.w = ew; }
  // the wires from each launcher box to its function's part on the bench: through the egg-link, build/ and the floor
  const wirePts = (exe, dy) => {
    const b = boxes[exe], s = partOf(SCRIPTS.find(q => q.name === exe).file).socket, down = exe === EXE ? b.button[0] + 52 : WH.x + 22;
    // into build/ over the bin's lip and down past the left of its label; at the crate, talker's enters its card below its

    clockRun(t => { const u = t - m('w2', .3), on = u >= 0 && u < 1.4; A.machine.run(Math.max(0, Math.min(u, 1.4)) * 1.6, on ? 1 : 0); }, D, { tail: true });
    // 3: source puts the install on the list: in on the board, its cards readable
    dim([A.prod, A.wh, ...A.goods], m('w3'), .35); dim([B.bd], m('w3'), 1);
    bot.to(LIST, m('w3', -.3), 1.2);
    tw(B.bd.title, { c_fill: '#ffffff' }, m('w3', .3), .3); pulse(B.cards.ws, m('w3', .6), 1.06);
    // 4: ros2 run finds the package, then the executable, and runs it: out to the helper at the shelf
    bot.to(LOW, m('w4', -.3), 1.3);   // the shelf, the helper and talker, all whole
    dim([B.bd], m('w4'), .35); dim([B.wh, ...B.goods, hp, tk], m('w4'), 1);
    tw(card.hiPkg, { o: 1 }, m('w4', 1.4), .3); tw(card.hiPkg, { o: 0 }, m('w4', 2.6), .3); tw(card.hiExe, { o: 1 }, m('w4', 2.6), .3);
    hp.to(m('w4', 2.8), { ...ROBOT_POSE.holdR, L: ROBOT_POSE.pressL.L, head: -4 }, .35).to(m('w4', 3.6), 'holdR', .4).face(m('w4', 3.2), 'happy');
    clockRun(t => B.boxes[EXE].press(t >= m('w4', 3.1) && t < m('w4', 3.5) ? 1 : 0), D, { tail: true });
    tk.sleep(-1, m('w4', 3.3)).hop(m('w4', 3.4), 14).flash(m('w4', 3.5)).face(m('w4', 3.5), 'happy');
    slowBadge(p, [[m('w2', .1), null, null]], { xr: 790, y: 52 });   // the machine's run and the press are drawn slower than they take; top centre, between steps 1 and 2
  }, { lead: false }],

  ['final1', '本章練習', () => { panel(0); }, { ask: done => quiz(SCREEN, PRACTICE, done, bi('本章練習', 'Chapter practice')) }],
  ['finish', '完成', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));
